<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Researcher Dashboard | MicroCount STEVision
    </title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .admin-page {
            min-height: calc(100vh - 110px);
            background: #f5f8fc;
            padding: 50px 8%;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
        }

        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .admin-title {
            color: #183b6b;
            margin-top: 0;
        }

        .admin-subtitle {
            color: #666;
        }

        .login-card {
            max-width: 500px;
            margin: 60px auto;
        }

        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0 18px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 16px;
        }

        .admin-button {
            background: #32c0cf;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-button:hover {
            background: #159eac;
        }

        .logout-button {
            float: right;
            background: #eeeeee;
            color: #222;
        }

        .logout-button:hover {
            background: #dddddd;
        }

        #dashboard {
            display: none;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }

        .stat-card {
            flex: 1;
            padding: 20px;
            background: #f5f8fc;
            border-radius: 12px;
        }

        .stat-number {
            display: block;
            font-size: 28px;
            font-weight: 700;
            color: #183b6b;
            margin-top: 5px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .submissions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .submissions-table th,
        .submissions-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e6ed;
            text-align: left;
            white-space: nowrap;
        }

        .submissions-table th {
            background: #f5f8fc;
            color: #183b6b;
        }

        .risk-level {
            font-weight: 700;
        }

        #loginMessage {
            margin-top: 15px;
            color: #b00020;
        }

        @media (max-width: 700px) {

            .admin-page {
                padding: 30px 15px;
            }

            .admin-card {
                padding: 22px;
            }

            .stats {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<main class="admin-page">

    <div class="admin-container">


        <!-- ============================== -->
        <!-- LOGIN -->
        <!-- ============================== -->

        <div
            id="loginCard"
            class="admin-card login-card">

            <h1 class="admin-title">
                Researcher Dashboard
            </h1>

            <p class="admin-subtitle">
                Sign in to view MicroCount STEVision submissions.
            </p>


            <label for="loginEmail">
                Email
            </label>

            <input
                id="loginEmail"
                class="admin-input"
                type="email"
                placeholder="Researcher email"
                autocomplete="username">


            <label for="loginPassword">
                Password
            </label>

            <input
                id="loginPassword"
                class="admin-input"
                type="password"
                placeholder="Password"
                autocomplete="current-password">


            <button
                id="loginButton"
                class="admin-button">

                Sign In

            </button>


            <p id="loginMessage"></p>

        </div>


        <!-- ============================== -->
        <!-- DASHBOARD -->
        <!-- ============================== -->

        <div
            id="dashboard"
            class="admin-card">

            <button
                id="logoutButton"
                class="admin-button logout-button">

                Sign Out

            </button>


            <h1 class="admin-title">
                Researcher Dashboard
            </h1>

            <p class="admin-subtitle">
                MicroCount STEVision User Findings
            </p>


            <!-- STATISTICS -->

            <div class="stats">

                <div class="stat-card">

                    <div>
                        Total Submissions
                    </div>

                    <span
                        id="submissionCount"
                        class="stat-number">
                        0
                    </span>

                </div>


                <div class="stat-card">

                    <div>
                        High-Risk Results
                    </div>

                    <span
                        id="highRiskCount"
                        class="stat-number">
                        0
                    </span>

                </div>

            </div>


            <!-- TABLE -->

            <div class="table-wrapper">

                <table class="submissions-table">

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Sample ID
                            </th>

                            <th>
                                School
                            </th>

                            <th>
                                Source
                            </th>

                            <th>
                                Condition
                            </th>

                            <th>
                                Days
                            </th>

                            <th>
                                Particles
                            </th>

                            <th>
                                Risk
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="submissionsBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="supabase.js"></script>

<script src="admin.js"></script>

</body>

</html>
